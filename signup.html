<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - The Royal Ethnix</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { background: white; padding: 30px 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 400px; }
        .hidden { display: none !important; }
        h1 { color: #222; margin-bottom: 5px; }
        h2 { color: #666; font-size: 16px; margin-top: 0; margin-bottom: 20px; font-weight: normal; }
        input, button { width: 100%; padding: 12px; margin-top: 15px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        input:focus { outline: none; border-color: #d4af37; }
        button { background-color: #d4af37; color: #111; border: none; cursor: pointer; font-weight: bold; transition: background-color 0.3s; }
        button:hover { background-color: #b5952f; }
        button.secondary { background-color: #eee; color: #333; margin-top: 10px; }
        button.secondary:hover { background-color: #ddd; }
        .toggle-link { margin-top: 20px; display: block; font-size: 14px; color: #555; text-decoration: none; cursor: pointer; }
        .toggle-link:hover { color: #d4af37; text-decoration: underline; }
    </style>
</head>
<body>

    <!-- SIGNUP SECTION -->
    <div id="signup-section" class="container">
        <h1>The Royal Ethnix</h1>
        <h2>Register New Staff</h2>
        <form onsubmit="handleSignup(event)">
            <input type="text" id="signupName" placeholder="Full Name" required>
            <input type="email" id="signupEmail" placeholder="Email Address" required>
            <input type="tel" id="signupPhone" placeholder="Phone Number (10 digits)" pattern="[0-9]{10}" required>
            <input type="password" id="signupPassword" placeholder="Create Password" required>
            <button type="submit">Sign Up</button>
        </form>
        <a href="login.html" class="toggle-link">Already have an account? Login</a>
    </div>

    <!-- VERIFICATION SECTION -->
    <div id="verify-section" class="container hidden">
        <h1>Verify Account</h1>
        <h2>Enter the OTP sent to your email</h2>
        <form onsubmit="handleVerify(event)">
            <input type="text" id="otpCode" placeholder="Enter 6-digit OTP" pattern="[0-9]{6}" required>
            <button type="submit">Verify & Continue</button>
            <button type="button" class="secondary" onclick="switchView('signup-section')">Go Back</button>
        </form>
    </div>

<script>
let timerInterval;

// Start the 2-minute countdown
function startOtpTimer() {
    let timeLeft = 120; // 2 minutes in seconds
    const timerText = document.getElementById('timerText');
    const countdownSpan = document.getElementById('countdown');
    const resendBtn = document.getElementById('resendOtpBtn');

    // Reset UI state
    timerText.style.display = 'inline';
    resendBtn.style.display = 'none';
    clearInterval(timerInterval);
    
    timerInterval = setInterval(() => {
        timeLeft--;
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        
        countdownSpan.textContent = 
            (minutes < 10 ? "0" + minutes : minutes) + ":" + 
            (seconds < 10 ? "0" + seconds : seconds);
        
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            timerText.style.display = 'none';
            resendBtn.style.display = 'inline';
        }
    }, 1000);
}

// Function to trigger OTP Sending
function sendOtpToEmail() {
    const email = document.getElementById('emailInput').value;
    const phone = document.getElementById('phoneInput').value;
    
    // Change button text to show loading
    document.getElementById('sendOtpButton').textContent = 'Sending OTP...';

    fetch('send_otp.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, phone: phone })
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {
            alert(data.message);
            // Hide registration form, show OTP verification form
            document.getElementById('registrationForm').style.display = 'none';
            document.getElementById('otpVerificationForm').style.display = 'block';
            startOtpTimer(); // Start countdown exactly when form appears
        } else {
            alert(data.message);
        }
        document.getElementById('sendOtpButton').textContent = 'Send OTP';
    })
    .catch(error => {
        alert('Error sending OTP. Please check your connection.');
        document.getElementById('sendOtpButton').textContent = 'Send OTP';
    });
}

// Bind Resend button
document.getElementById('resendOtpBtn').addEventListener('click', function() {
    sendOtpToEmail(); 
});
</script>
</body>
</html>
