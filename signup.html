<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - The Royal Ethnix</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { background: white; padding: 30px 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 400px; }
        h1 { color: #222; margin-bottom: 5px; }
        h2 { color: #666; font-size: 16px; margin-top: 0; margin-bottom: 20px; font-weight: normal; }
        input, button { width: 100%; padding: 12px; margin-top: 15px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        input:focus { outline: none; border-color: #d4af37; }
        button { background-color: #d4af37; color: #111; border: none; cursor: pointer; font-weight: bold; transition: background-color 0.3s; }
        button:hover { background-color: #b5952f; }
        .toggle-link { margin-top: 20px; display: block; font-size: 14px; color: #555; text-decoration: none; cursor: pointer; }
        .toggle-link:hover { color: #d4af37; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container">
        <h1>The Royal Ethnix</h1>
        <h2>Register New Staff</h2>
        <form onsubmit="handleSignup(event)">
            <input type="text" id="signupName" placeholder="Full Name" required>
            <input type="email" id="signupEmail" placeholder="Email Address" required>
            <input type="tel" id="signupPhone" placeholder="Phone Number (10 digits)" pattern="[0-9]{10}" required>
            <input type="password" id="signupPassword" placeholder="Create Password" required>
            <button type="submit">Sign Up</button>
        </form>
        <a href="login.html" class="toggle-link">Already have an account? Login</a>
    </div>

<script>
    const API_URL = 'https://traffic-paper-starless.ngrok-free.dev/royal_ethnix_api/signup.php';
    async function handleSignup(event) {
        event.preventDefault();
        
        const name = document.getElementById('signupName').value;
        const email = document.getElementById('signupEmail').value;
        const phone = document.getElementById('signupPhone').value;
        const password = document.getElementById('signupPassword').value;
        const submitBtn = event.target.querySelector('button');

        submitBtn.textContent = "Processing...";
        submitBtn.disabled = true;

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'ngrok-skip-browser-warning': '1' // Bypasses the ngrok free tier warning screen
                },
                body: JSON.stringify({ name, email, phone, password })
            });

            const data = await response.json();

            if (data.status === 'success') {
    alert(data.message); // This will now show the exact PHPMailer error
    switchView('verify-section');
}
            } else {
                alert(data.message);
            }
        } catch (error) {
            console.error('Signup Error:', error);
            alert("Failed to connect to the server.");
        } finally {
            submitBtn.textContent = "Sign Up";
            submitBtn.disabled = false;
        }
    }
</script>
</body>
</html>
