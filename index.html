<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - The Royal Ethnix</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { background: white; padding: 30px 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 500px; }
        h1 { color: #222; margin-bottom: 5px; }
        h2 { color: #666; font-size: 16px; margin-top: 0; font-weight: normal; margin-bottom: 20px; }
        .user-greeting { margin-bottom: 20px; font-weight: bold; color: #d4af37; }
        select, button { width: 100%; padding: 12px; margin-top: 15px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        select:focus { outline: none; border-color: #d4af37; }
        button { background-color: #d4af37; color: #111; border: none; cursor: pointer; font-weight: bold; transition: background-color 0.3s; }
        button:hover { background-color: #b5952f; }
        button.secondary { background-color: #eee; color: #333; margin-top: 10px; }
        button.secondary:hover { background-color: #ddd; }
        #status { margin-top: 20px; font-size: 14px; color: #888; }
        #webcam { display: none; width: 100%; border-radius: 5px; margin-top: 15px; border: 1px solid #ccc; background-color: #000; }
    </style>
</head>
<body>

    <div class="container">
        <h1>The Royal Ethnix</h1>
        <h2>Staff Biometric Portal</h2>
        
        <div id="greeting" class="user-greeting">Loading...</div>
        
        <select id="shiftDropdown">
            <option value="">Loading shifts from database...</option>
        </select>
        
        <button onclick="startFaceScan()">Start Face Scan</button>
        
        <video id="webcam" autoplay playsinline muted></video>
        
        <div id="status">Connecting to database...</div>

        <button class="secondary" onclick="logout()">Logout</button>
    </div>

<script>
    // Security check: Redirect to login if user data doesn't exist
    const userJson = localStorage.getItem('user');
    if (!userJson) {
        window.location.href = 'login.html';
    } else {
        const user = JSON.parse(userJson);
        document.getElementById('greeting').textContent = `Welcome, ${user.name} (${user.employee_code})`;
        fetchShifts();
    }

    function fetchShifts() {
        fetch('https://traffic-paper-starless.ngrok-free.dev/royal_ethnix_api/get_shifts.php', {
            headers: {
                'ngrok-skip-browser-warning': '1'
            }
        })
        .then(response => response.json())
        .then(data => {
            const dropdown = document.getElementById('shiftDropdown');
            const status = document.getElementById('status');
            
            dropdown.innerHTML = '<option value="">-- Select Your Shift --</option>';
            
            if (data.status === 'success') {
                data.data.forEach(shift => {
                    const option = document.createElement('option');
                    option.value = shift.id;
                    option.textContent = `${shift.shift_name} (${shift.start_time} - ${shift.end_time})`;
                    dropdown.appendChild(option);
                });
                status.innerHTML = '🟢 Connected to API successfully';
                status.style.color = "green";
            } else {
                status.textContent = "API Error: " + data.message;
                status.style.color = "red";
            }
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('status').innerHTML = "🔴 Failed to connect to server.";
            document.getElementById('status').style.color = "red";
        });
    }

    function startFaceScan() {
        const shiftId = document.getElementById('shiftDropdown').value;
        const status = document.getElementById('status');
        const video = document.getElementById('webcam');
        
        if(!shiftId) {
            alert("Please select your shift before scanning.");
            return;
        }

        video.style.display = "block";
        status.textContent = "📷 Requesting camera access...";
        status.style.color = "#111";

        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                video.srcObject = stream;
                status.textContent = "🟢 Camera active. Position your face in the frame.";
                status.style.color = "green";
            })
            .catch(err => {
                console.error("Camera error:", err);
                status.textContent = "🔴 Camera access denied or unavailable.";
                status.style.color = "red";
                video.style.display = "none";
            });
    }

    function logout() {
        const video = document.getElementById('webcam');
        if (video.srcObject) {
            video.srcObject.getTracks().forEach(track => track.stop());
        }
        localStorage.removeItem('user');
        window.location.href = 'login.html';
    }
</script>

</body>
</html>
