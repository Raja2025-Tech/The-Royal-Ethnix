<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - The Royal Ethnix</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { background: white; padding: 30px 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 400px; }
        h1 { color: #222; margin-bottom: 5px; }
        h2 { color: #666; font-size: 16px; margin-top: 0; margin-bottom: 20px; font-weight: normal; }
        input, button { width: 100%; padding: 12px; margin-top: 15px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        input:focus { outline: none; border-color: #d4af37; }
        button { background-color: #d4af37; color: #111; border: none; cursor: pointer; font-weight: bold; transition: background-color 0.3s; }
        button:hover { background-color: #b5952f; }
        .toggle-link { margin-top: 20px; display: block; font-size: 14px; color: #555; text-decoration: none; cursor: pointer; }
        .toggle-link:hover { color: #d4af37; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container">
        <h1>The Royal Ethnix</h1>
        <h2>Staff Login</h2>
        <form onsubmit="handleLogin(event)">
            <input type="text" id="loginId" placeholder="Email or Phone Number" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <a href="signup.html" class="toggle-link">Don't have an account? Sign Up</a>
    </div>

<script>
    const API_URL = 'https://traffic-paper-starless.ngrok-free.dev/royal_ethnix_api/login.php';

    async function handleLogin(event) {
        event.preventDefault();
        
        const loginId = document.getElementById('loginId').value;
        const password = document.getElementById('loginPassword').value;
        const submitBtn = event.target.querySelector('button');
        
        submitBtn.textContent = "Logging in...";
        submitBtn.disabled = true;

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'ngrok-skip-browser-warning': '1' 
                },
                body: JSON.stringify({ loginId, password })
            });

            const text = await response.text();
            let data;
            try {
                data = JSON.parse(text);
            } catch (jsonErr) {
                console.error("Server returned non-JSON response:", text);
                alert("Server error. Check the developer console.");
                return;
            }

            if (data.status === 'success') {
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = 'index.html'; 
            } else {
                alert(data.message); 
            }
        } catch (error) {
            console.error('Login Error:', error);
            alert("Failed to connect to the authentication server. Ensure ngrok and XAMPP are running.");
        } finally {
            submitBtn.textContent = "Login";
            submitBtn.disabled = false;
        }
    }
</script>
</body>
</html>
